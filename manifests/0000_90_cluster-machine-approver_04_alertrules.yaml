apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    prometheus: k8s
    role: alert-rules
  name: machineapprover-rules
  namespace: openshift-cluster-machine-approver
  annotations:
    exclude.release.openshift.io/internal-openshift-hosted: "true"
    include.release.openshift.io/self-managed-high-availability: "true"
    include.release.openshift.io/single-node-developer: "true"
spec:
  groups:
    - name: cluster-machine-approver.rules
      rules:
        - alert: MachineApproverMaxPendingCSRsReached
          expr: |
             mapi_current_pending_csr > mapi_max_pending_csr
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "max pending CSRs threshold reached."
            description: |
              The number of pending CertificateSigningRequests has exceeded the
              maximum threshold (current number of machine + 100). Check the
              pending CSRs to determine which machines need approval, also check
              that the nodelink controller is running in the openshift-machine-api
              namespace.
        - alert: MachineApproverDuplicateCSRDenied
          expr: |
             increase(mapi_duplicate_csr_denied_total[5m]) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "duplicate node CSRs were denied."
            description: |
              Cluster Machine Approver has been denying superseded pending node
              CertificateSigningRequests for at least 15 minutes (a newer CSR
              exists for the same node and signer). Short one-off denials during
              address population lag are tolerated and do not fire this alert.
              Sustained denials usually mean kubelets keep reissuing while the
              newest CSR stays unauthorizable (for example Machine addresses
              missing), approval is deferred, or CMA is not approving in time.
              Inspect pending/denied CSRs, Machine status.addresses, and
              machine-approver logs.
